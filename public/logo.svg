<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 34" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Syne:wght@800;900&amp;display=swap');
      .logo-brand {
        font-family: 'Unbounded', 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 19.5px;
        letter-spacing: -0.6px;
        fill: #0f172a;
      }
      .logo-brand .lol-accent {
        fill: #059669;
        font-style: italic;
      }
      @media (prefers-color-scheme: dark) {
        .logo-brand { fill: #ffffff; }
        .logo-brand .lol-accent { fill: #10B981; }
      }
    </style>
  </defs>
  
  <!-- Classic Clean Hyperlink Badge -->
  <g transform="translate(1, 1)">
    <rect width="32" height="32" rx="8" fill="#059669"/>
    <!-- Top Right Link Loop -->
    <path d="M15 11L18 8C20.2 5.8 23.8 5.8 26 8C28.2 10.2 28.2 13.8 26 16L23 19" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Bottom Left Link Loop -->
    <path d="M17 21L14 24C11.8 26.2 8.2 26.2 6 24C3.8 21.8 3.8 18.2 6 16L9 13" stroke="#A7F3D0" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Connecting Link Bar -->
    <line x1="12" y1="20" x2="20" y2="12" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  
  <!-- Lowercase paylink.lol -->
  <text class="logo-brand" x="44" y="24">paylink<tspan class="lol-accent">.lol</tspan></text>
</svg>
